/* ProAutoDial full-site design system — page-wide consistency pass */
:root{--red:#d71932;--deep:#b80f28;--navy:#111b3b;--ink:#17213a;--muted:#687184;--line:#e7e9ef;--soft:#fff7f8;--shadow:0 12px 32px rgba(19,27,51,.08)}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{background:#fff;color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
a{transition:color .18s ease,background .18s ease,border-color .18s ease,transform .18s ease}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid rgba(215,25,50,.3);outline-offset:3px}
.skip-link{position:absolute;left:12px;top:-70px;z-index:100;background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:9px;padding:10px 14px}
.skip-link:focus{top:12px}
.header{background:rgba(255,255,255,.97);box-shadow:0 4px 18px rgba(17,24,39,.035)}
.navrow{width:min(1480px,96%);gap:18px}
.logo img{width:248px;height:60px}
.nav{gap:18px}
.nav a{font-size:13px}
.navactions{gap:10px}
.phonepill{color:var(--deep);font-size:13px}
.pagehero{background:radial-gradient(ellipse at 86% 14%,#ffe4e8 0,transparent 38%),linear-gradient(110deg,#fff 0%,#fff7f8 58%,#fff 100%);padding:36px 0 40px;overflow:hidden}
.pagehero .container{width:min(1280px,94%)}
.pagehero .herogrid{grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:38px;min-height:340px}
.pagehero .herocopy h1{font:800 clamp(34px,4vw,52px)/1.08 Manrope,"DM Sans",sans-serif;letter-spacing:-.045em;color:var(--navy);margin:0 0 14px}
.pagehero .herocopy h1 em{font-style:normal;color:var(--red)}
.pagehero .herocopy p{font-size:16px;line-height:1.65;color:#343e52;max-width:630px;margin:0 0 22px}
.pagehero .eyebrow{display:inline-flex;background:#ffe7eb;color:#c8102b;border-radius:999px;padding:8px 16px;font-size:11px;letter-spacing:.08em;margin-bottom:14px}
.pagehero .heroimage{height:350px;border-radius:23px;background:#fff;box-shadow:0 13px 30px rgba(17,24,39,.08)}
.pagehero .heroimage>img{width:100%;height:100%;object-fit:cover}
.pagehero .floatcard{border:1px solid rgba(231,233,239,.9);box-shadow:0 10px 25px rgba(17,24,39,.09);background:rgba(255,255,255,.96)}
.pagehero .checks{display:flex;gap:15px;flex-wrap:wrap;color:#475166;font-size:11px}
.pagehero .actions{display:flex;gap:12px;flex-wrap:wrap}
.pagehero .actions .btn{min-height:47px;padding:12px 20px}
.section{padding-top:60px;padding-bottom:60px}
.sectiontitle{max-width:850px;margin:0 auto 30px}
.sectiontitle h2{font:800 clamp(27px,3vw,38px)/1.15 Manrope,"DM Sans",sans-serif;color:var(--navy);letter-spacing:-.035em;margin:0 0 10px}
.sectiontitle h2 em{color:var(--red);font-style:normal}
.sectiontitle p{max-width:720px;margin:0 auto;color:var(--muted);font-size:14px;line-height:1.7}
.sectiontitle .eyebrow{margin-bottom:10px}
.cards{gap:18px}
.card{border:1px solid #e7e9ef;border-radius:19px;box-shadow:0 8px 24px rgba(17,24,39,.045)}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(17,24,39,.09)}
.cardimg{height:180px;object-fit:cover}
.cardbody{padding:20px}
.cardbody h3{font:800 17px/1.28 Manrope,sans-serif;color:var(--navy);margin:8px 0}

.textlink{color:var(--red);font-size:12px;font-weight:800}
.industrygrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.industry{border-color:#e6e8ef;border-radius:17px;box-shadow:0 7px 21px rgba(17,24,39,.045)}

.industry>img{height:155px;object-fit:cover}
.industry>div{padding:16px}
