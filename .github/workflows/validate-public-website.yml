name: Validate public website

on:
  push:
    branches:
      - frontend-development
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate routes, assets and JavaScript
        run: node scripts/validate-public-site.mjs
