function voiceforgood(){let initi=[['◎','One India Emergency Connect','A multilingual directory of verified emergency and relief helplines to help people find the appropriate contact.'],['♡','Find My Family','A consent-based family-reconnection assistance service coordinated through verified relief partners.'],['♙','Volunteer Connect','Connect available volunteers with verified NGOs and relief organisations that need support.'],['✚','Medical Assistance Connect','Help route requests for blood donors, medicines and emergency medical assistance.'],['⌂','Relief Distribution Helpline','Help communities locate food, drinking water, temporary shelters and relief centres.']];return `${hero('PROAUTODIAL VOICE FOR GOOD','Connecting people. Supporting communities.','Saving time when every second matters.','Technology should not only generate revenue. It should make a difference when people need help the most. Starting in Southern India, we aim to expand this humanitarian communication initiative across every state in India.',img.relief,'Partner With Us')}<section class="container section">${title('OUR COMMITMENT','Use technology to','serve humanity.','Free communication support for eligible organisations and genuine causes, subject to verification, capacity and applicable requirements.')}<div class="goodcards"><article class="goodcard"><span class="sym">☏</span><h3>Free Communication Services</h3><p>For eligible NGOs, non-profits, schools, educational and devotional organisations, community welfare groups and social-impact initiatives.</p></article><article class="goodcard"><span class="sym">♡</span><h3>100% Free Charity Campaigns</h3><p>Eligible charitable campaigns can receive free campaign calling services and full-time campaign technical support.</p></article><article class="goodcard"><span class="sym">⚑</span><h3>Disaster Response Connect — India</h3><p>Emergency hotline numbers, multilingual helplines, remote technical support, relief coordination and mobile communication support where feasible.</p></article><article class="goodcard"><span class="sym">🐾</span><h3>Animal Welfare Helplines</h3><p>Free toll-free animal helpline service for genuine NGOs working to rescue, protect and care for animals. We stand with causes that protect every life.</p><b class="cause">Every life matters. Every voice deserves to be heard.</b></article><article class="goodcard"><span class="sym">▣</span><h3>Mobile Communication Support</h3><p>Available mobile support units may assist with local networking and communication infrastructure when safe, authorised and operationally feasible.</p></article><article class="goodcard"><span class="sym">✈</span><h3>Commercial Drone Relief Support</h3><p>Where permitted and appropriate, coordinate commercial drone partners for delivery of food, medicines and essentials to remote or inaccessible areas during disaster response.</p></article></div></section><section class="levels"><div class="container">${title('DISASTER RESPONSE MODEL','A three-level','response framework.','Support is planned with local partners and authorised authorities. Deployment depends on operational availability and local permissions.')}<div class="levelgrid"><article><span class="num">01</span><h3>Level 1 — Remote Response</h3><ul><li>Emergency helpline activation</li><li>IVR configuration and call routing</li><li>24/7 remote technical assistance</li></ul></article><article><span class="num">02</span><h3>Level 2 — Regional Response</h3><ul><li>Coordinate with local NGOs and volunteers</li><li>Regional communication support</li><li>Mobile support where feasible</li></ul></article><article><span class="num">03</span><h3>Level 3 — Major Disaster Response</h3><ul><li>Mobilise available technical teams</li><li>Coordinate mobile communication resources</li><li>Work with authorised authorities and relief partners</li></ul></article></div></div></section><section class="container section">${title('COMMUNITY IMPACT INITIATIVES','Five ways to connect','people to help.')}<div class="initiativegrid">${initi.map(x=>`<article class="initiative"><span class="sym">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></section><section class="container section partner"><div><span class="eyebrow">PARTNER WITH US</span><h2>Help us build a stronger support network.</h2><p>We invite NGOs, schools, hospitals, animal welfare groups, disaster relief organisations, volunteer networks, telecom providers, district-level authorities and CSR partners to collaborate.</p><div class="tags"><span>Connectivity</span><span>Vehicles</span><span>Volunteers</span><span>Relief partners</span><span>CSR</span></div><a class="btn" href="/contact">Become a Partner →</a></div><img src="https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?auto=format&fit=crop&w=1000&q=85" alt="Community volunteers"></section><section class="container section">${title('COMMUNITY IMPACT STORIES','Measure outcomes. Share','verified stories.','We will publish verified updates on helplines activated, campaigns supported, volunteers connected, organisations assisted and communication resources deployed.')}<div class="impact"><span class="sym">♡</span><div><b>Community stories will be published after verification.</b><small>We will prioritise measurable outcomes and partner-confirmed reporting over promotional claims.</small></div></div></section><div class="container note">Operational disclaimer: All free services are subject to eligibility verification, terms and conditions, technical feasibility, resource availability and applicable laws. Hotline activation, mobile vehicle deployment, connectivity restoration, field operations and drone operations require local authorisation and coordination with relevant authorities and service providers. ProAutoDial Voice for Good is supplementary communication support and does not replace official emergency services or government disaster-response systems. Drone activity is subject to aviation rules, permissions, safety assessment and operator availability.</div>`}
function about(){return `${hero('ABOUT PROAUTODIAL','Built from real call-centre experience.','Designed for what comes next.','From frontline telecalling to legacy telephony deployments, our journey has been shaped by the operational realities of customer communication — and a belief that AI should strengthen, not replace, human service.',img.team)}<section class="container section">${title('OUR JOURNEY','From the calling floor to','an AI voice workforce.','A practical progression across operations, implementation, platform building and intelligent automation.')}<div class="timeline"><article><span>2011</span><div><h3>Started on the calling floor</h3><p>Started professional work in technology as a QA Engineer, building a foundation in systems, quality and delivery.</p></div></article><article><span>2011–2018</span><div><h3>Learned, delivered and grew through roles</h3><p>Progressed through Business Analysis, Agile delivery and Product Management roles across enterprise programmes.</p></div></article><article><span>Freelance</span><div><h3>Delivered telephony solutions</h3><p>Expanded into business building and communication technology, drawing on experience in enterprise applications, customer operations and platform delivery.</p></div></article><article><span>Platform</span><div><h3>Built a proprietary call-centre application</h3><p>Moved from implementing legacy platforms to shaping a platform designed around customer operations, campaign workflows and reporting.</p></div></article><article><span>Today</span><div><h3>Transforming into an AI + Human call centre</h3><p>ProAutoDial combines AI voice agents, multilingual conversations, browser-based telephony and a direct human handoff path.</p></div></article></div></section><section class="founderband"><div class="container founder"><img src="${A}founder-janakiram.webp" alt="Janakiram Raghutu"><div><span class="eyebrow">FOUNDER & CHIEF ARCHITECT</span><h2>Janakiram Raghutu</h2><p class="lead">A serial entrepreneur a function normalise(path){return path.replace(/\/$/,'')||'/'}
function render(){let path=normalise(location.pathname);let isAr=path==='/ar'||path.startsWith('/ar/');let route=path.replace(/^\/ar/,'')||'/';let pageFn=pageMap[route]||(route.startsWith('/solutions')?solutionspage:(route.startsWith('/industries')?industriespage:industriespage));let page=(isAr?arabic:pageFn)();document.documentElement.lang=isAr?'ar':'en';document.documentElement.dir=isAr?'rtl':'ltr';document.getElementById('app').innerHTML=isAr?page:header()+`<main>${page}</main>`+footer();document.querySelectorAll('.nav a').forEach(a=>{if(normalise(a.getAttribute('href'))===path)a.classList.add('active')});}

document.addEventListener('click',e=>{let a=e.target.closest('a');if(a&&a.getAttribute('href')&&a.getAttribute('href').startsWith('/')&&!a.getAttribute('href').startsWith('//')){e.preventDefault();navigate(a.getAttribute('href'));return}if(e.target.id==='hamb'){document.getElementById('nav')?.classList.toggle('open')}const caseButton=e.target.closest?.('.usecard[data-case]');if(caseButton){let i=Number(caseButton.dataset.case);document.querySelectorAll('.usecard').forEach(x=>x.classList.remove('selected'));caseButton.classList.add('selected');document.getElementById('flowtitle').textContent=cases[i][0];document.getElementById('flowdesc').textContent=cases[i][2];document.getElementById('flowsteps').innerHTML=cases[i][3].map((s,j)=>`<div class="flowstep"><span>0${j+1}</span><b>${s}</b></div>`).join('')}const tabButton=e.target.closest?.('.tabs button[data-tab]');if(tabButton){let names=['Real Estate','Dental','Travel','Restaurants','Education','Finance'];let bundles=[['New Property Lead Follow-up','Site Visit Confirmation','Pricing & Offer Reminder'],['New Patient Booking','Recall & Cleaning Reminder','Appointment Confirmation'],['Travel Enquiry Follow-up','Hotel Reservation Confirmation','Trip Reminder'],['Table Reservation','Guest Confirmation','Feedback Call'],['Admission Enquiry','Parent Meeting Confirmation','Fee Reminder'],['Loan Enquiry Qualification','Payment Reminder','Document Follow-up']];document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));tabButton.classList.add('active');document.getElementById('campaignitems').innerHTML=bundles[Number(tabButton.dataset.tab)].map((x,j)=>`<article><b>${x}</b><small>${['Capture intent and customer details.','Confirm the required details and next step.','Record the outcome for the team.'][j]}</small></article>`).join('')}if(e.target.classList.contains('prompt')){let transcript=document.getElementById('transcript');transcript.innerHTML='<p class="ai">Hello, thank you for contacting ProAutoDial. How may I help you today?</p><p class="human">'+e.target.textContent.replaceAll('“','').replaceAll('”','')+'</p><p class="ai">I can help with that. I can also connect you with a human team member whenever you ask.</p>'}if(e.target.id==='startsim'){let on=e.target.dataset.on!=='1';e.target.dataset.on=on?'1':'0';e.target.textContent=on?'End Demo Preview':'Start Demo Preview →';document.getElementById('mikorb').classList.toggle('on',on);document.getElementById('readytxt').textContent=on?'Demo preview active':'Ready to Call';document.getElementById('simstatus').textContent=on?'● Preview active':'● System ready';document.getElementById('transcript').innerHTML=on?'<p class="ai">Hello, thank you for calling ProAutoDial. How may I help you today?</p><p class="human">I want to know about your packages.</p><p class="ai">Certainly. I can explain the options or connect you with a team member. What would you prefer?</p>':'<div class="empty">Select an agent and start the demo preview to explore a sample conversation.</div>'}});
